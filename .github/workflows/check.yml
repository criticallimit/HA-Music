name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal clickable Mac app
        run: bash tools/mac-app/build.sh
      - name: Check native core and transport
        run: |
          "build/mac-app/HA Music Playlist Sync.app/Contents/MacOS/HA Music Playlist Sync" --self-test
          MAC_APP_BIN="$PWD/build/mac-app/HA Music Playlist Sync.app/Contents/MacOS/HA Music Playlist Sync" python3 -m unittest discover -s tests -p 'test_mac_app.py' -v
      - name: Check native window and capture preview
        run: '"build/mac-app/HA Music Playlist Sync.app/Contents/MacOS/HA Music Playlist Sync" --ui-smoke "$PWD/build/mac-app/Mac-App-Vorschau.png"'
      - uses: actions/upload-artifact@v4
        with:
          name: HA-Music-Playlist-Sync-Mac
          path: |
            build/mac-app/HA-Music-Playlist-Sync.zip
            build/mac-app/LIESMICH.txt
            build/mac-app/Mac-App-Vorschau.png
          retention-days: 90
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install template test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Check Python syntax and frontend contracts
        run: |
          python -m py_compile ha_music/app.py ha_music/metadata.py ha_music/metadata_feed.py ha_music/logo_sources.py
          python tests/test_scaffold.py
          python tests/test_smoke.py
          python -m unittest discover -s tests -p 'test_runtime.py' -v
          python -m unittest discover -s tests -p 'test_saved_controls.py' -v
          python -m unittest discover -s tests -p 'test_playlist_sync.py' -v
          python -m py_compile tools/mac_playlist_sync.py
          python -m unittest discover -s tests -p 'test_discovery_template.py' -v
          python -m unittest discover -s tests -p 'test_logo_sources.py' -v
          python -m unittest discover -s tests -p 'test_apple_album_verification.py' -v
          node --check ha_music/web/app.js
          node --check ha_music/lovelace/ha-music-card.js
          node --check ha_music/lovelace/ha-music-card-loader.js
          node --test tests/frontend.test.cjs
          node --test tests/layout.test.cjs

      - name: Install pinned browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/ha-music-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/ha-music-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check actual mobile and desktop layout in Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/ha-music-browser/node_modules
        run: node tests/browser_layout.cjs
