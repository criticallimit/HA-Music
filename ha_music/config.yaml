name: HA Music
version: "0.0.6"
slug: ha_music
description: Radio dashboard for Alexa with future Apple Music support
url: https://github.com/criticallimit/HA-Music
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:music-circle
panel_title: HA Music
homeassistant_api: true
hassio_api: true
map:
  - type: homeassistant_config
    read_only: false
options:
  show_dashboard_setup: false
  devices:
    - entity_id: media_player.wohnung
      name: Wohnung
      enabled: true
    - entity_id: media_player.wohnzimmer
      name: Wohnzimmer
      enabled: true
    - entity_id: media_player.kueche
      name: Küche
      enabled: true
    - entity_id: media_player.bad
      name: Bad
      enabled: true
schema:
  show_dashboard_setup: bool
  devices:
    - entity_id: "match(^media_player\\.[a-z0-9_]+$)"
      name: str
      enabled: bool
