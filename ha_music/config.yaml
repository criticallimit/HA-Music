name: HA Music
version: "0.0.6"
slug: ha_music
description: Radio dashboard for Alexa with future Apple Music support
url: https://github.com/criticallimit/HA-Music
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:music-circle
panel_title: HA Music
homeassistant_api: true
hassio_api: true
map:
  - type: homeassistant_config
    read_only: false
options:
  show_dashboard_setup: false
  apple_music_target: media_player.wohnzimmer
  apple_music_group: Wohnung
  apple_music_favorites: []
  devices:
    - entity_id: media_player.wohnung
      name: Wohnung
      status: Aktiv
    - entity_id: media_player.wohnzimmer
      name: Wohnzimmer
      status: Aktiv
    - entity_id: media_player.kueche
      name: Küche
      status: Aktiv
    - entity_id: media_player.bad
      name: Bad
      status: Aktiv
schema:
  show_dashboard_setup: bool
  apple_music_target: "match(^media_player\\.[a-z0-9_]+$)?"
  apple_music_group: "str?"
  apple_music_favorites:
    - name: str
      kind: "list(Playlist|Album)"
      search: "str?"
  devices:
    - entity_id: "match(^media_player\\.[a-z0-9_]+$)"
      name: str
      status: "list(Aktiv|Inaktiv)?"
      enabled: "bool?"
