name: HA Music
version: "0.0.6"
slug: ha_music
description: Alexa multiroom radio and Apple Music favorites dashboard
url: https://github.com/criticallimit/HA-Music
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:music-circle
panel_title: HA Music
homeassistant_api: true
hassio_api: true
map:
  - type: homeassistant_config
    read_only: false
options:
  show_dashboard_setup: false
  music_assistant_url: ""
  music_assistant_token: ""
  devices:
    - entity_id: media_player.wohnung
      name: Wohnung
      status: Aktiv
    - entity_id: media_player.wohnzimmer
      name: Wohnzimmer
      status: Aktiv
    - entity_id: media_player.kueche
      name: Küche
      status: Aktiv
    - entity_id: media_player.bad
      name: Bad
      status: Aktiv
schema:
  show_dashboard_setup: bool
  music_assistant_url: "str?"
  music_assistant_token: "password?"
  apple_music_target: "match(^media_player\\.[a-z0-9_]+$)?"
  apple_music_group: "str?"
  devices:
    - name: str
      status: "list(Aktiv|Inaktiv)?"
      entity_id: "match(^media_player\\.[a-z0-9_]+$)"
      enabled: "bool?"

