name: HA Music
version: "0.0.1"
slug: ha_music
description: Radio dashboard for Alexa with future Apple Music support
url: https://github.com/criticallimit/HA-Music
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:music-circle
homeassistant_api: true
map:
  - addon_config:rw
options:
  command_device_id: ""
  alexa_group_name: ""
schema:
  command_device_id: str?
  alexa_group_name: str?
