configuration:
  apple_music_target:
    name: Abweichendes Apple-Music-Steuergerät (optional)
    description: >-
      Ohne diese Option verwendet Apple Music wie Radio das Wohnzimmer.
      Nur für eine bewusst abweichende Einrichtung: Entity-ID eines aktiven Echo-Geräts.
      Das Gerät muss auch unter Alexa-Geräte auf Aktiv stehen.
  apple_music_group:
    name: Abweichende Apple-Music-Lautsprechergruppe (optional)
    description: >-
      Ohne diese Option verwendet Apple Music wie Radio die Alexa-Gruppe Wohnung.
      Nur für eine bewusst abweichende Einrichtung: exakter Alexa-Gruppenname.
      Ein ausdrücklich leerer Wert bedeutet Wiedergabe direkt auf dem Steuergerät.
      Die Gerätauswahl unten ändert die Alexa-Gruppenmitgliedschaft nicht.
  apple_music_favorites:
    name: Apple-Music-Favoriten
    description: >-
      Playlists und Alben für die Apple-Music-Seite. Apple Music muss zuvor in der
      Alexa-App mit deinem Apple Account verknüpft werden. Speichern und das Add-on
      neu starten. Es werden keine Zugangsdaten im Add-on benötigt.
    fields:
      name:
        name: Anzeigename
        description: Name der Kachel in HA Music; ohne Suchbegriff auch der an Alexa gesendete Name.
      kind:
        name: Art
        description: Persönliche Playlist oder Album aus Apple Music.
      search:
        name: Suchbegriff (optional)
        description: Exakter Playlistname oder Albumtitel mit Interpret; leer lassen, um den Anzeigenamen zu verwenden.
  show_dashboard_setup:
    name: Dashboard-Einrichtung anzeigen
    description: Zeigt die Einrichtung der Lovelace-Karte in HA Music an.
  devices:
    name: Alexa-Geräte
    description: >-
      Erkannte Geräte werden beim Einschalten von HA Music ergänzt, auch wenn sie nicht verfügbar sind.
      Dazu gehören registrierte Echo Dots und Fire TVs. Neue Geräte sind zunächst deaktiviert.
      Zum Ändern den Stift öffnen und den HA-Music-Status auf Aktiv oder Inaktiv setzen, nicht den Papierkorb verwenden.
      Die Liste zeigt Gerätename, Status und technische Zuordnung. Wohnzimmer muss für die Standardwiedergabe aktiv bleiben.
      Ausgeblendete Geräte bleiben in dieser Liste. Anschließend speichern und das Add-on neu starten.
    fields:
      entity_id:
        name: Entity-ID
        description: Technische Zuordnung aus der Alexa-Integration. Für eine reine Namensänderung nicht ändern; dafür Gerätename verwenden.
      name:
        name: Gerätename
        description: Angezeigter Name in der Geräteliste und in HA Music.
      status:
        name: HA-Music-Status
        description: >-
          Aktiv zeigt das Gerät in Ingress und erlaubt HA-Music-Steuerbefehle.
          Inaktiv blendet es aus und verhindert diese Befehle, ohne den Eintrag zu löschen.
          Die Stromversorgung und die Alexa-Gruppenmitgliedschaft bleiben unverändert.
      enabled:
        name: Bisherige Auswahl (wird automatisch übernommen)
        description: >-
          Nur für ältere Konfigurationen. Beim nächsten Start des Add-ons wird dieser Wert
          in Aktiv oder Inaktiv übernommen. Wenn der HA-Music-Status bereits gewählt
          ist, gilt dieser; die bisherige Auswahl wird entfernt.

