configuration:
  show_dashboard_setup:
    name: Show dashboard setup
    description: Show Lovelace card setup in HA Music.
  devices:
    name: Alexa devices
    description: >-
      Detected devices are added when you turn on HA Music, including unavailable devices.
      This includes registered Echo Dots and Fire TVs. New devices are disabled initially.
      Use the pencil to change "Show and control in Ingress", rather than deleting the entry.
      Hidden devices remain in this list. Save changes and restart the add-on.
    fields:
      entity_id:
        name: Entity ID
        description: The media_player entity registered by the Alexa integration.
      name:
        name: Device name
        description: Display name in the device list and HA Music.
      enabled:
        name: Show and control in Ingress
        description: >-
          On shows the device in HA Music and allows HA Music control commands.
          Off hides it and prevents these commands without deleting the entry.
          Power supply and Alexa group membership are unaffected.
