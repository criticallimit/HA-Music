configuration:
  playlist_sync_token:
    name: Mac playlist synchronization key (optional)
    description: Key for the Mac app or helper. Only permits updating playlist tracks and optionally adding new playlist favorites, never playback. Empty disables synchronization. Expose the optional network port only on your home network.
  apple_music_target:
    name: Alternate Apple Music command device (optional)
    description: Omit this option to use Wohnzimmer, as radio does. Only for an intentionally different setup; specify the entity ID of an Echo enabled in Alexa devices.
  apple_music_group:
    name: Alternate Apple Music speaker group (optional)
    description: Omit this option to use the Alexa group Wohnung, as radio does. Only for an intentionally different setup; specify the exact Alexa group name. An explicitly empty value plays directly on the command device. Device visibility does not change Alexa group membership.
  show_dashboard_setup:
    name: Show dashboard setup
    description: Show Lovelace card setup in HA Music.
  devices:
    name: Alexa devices
    description: >-
      Detected devices are added when you turn on HA Music, including unavailable devices.
      This includes registered Echo Dots and Fire TVs. New devices are disabled initially.
      Use the pencil to select the HA Music status Aktiv (active) or Inaktiv (inactive), rather than deleting the entry.
      Rows show the device name, status and technical mapping. Keep Wohnzimmer active for default playback.
      Hidden devices remain in this list. Save changes and restart the add-on.
    fields:
      entity_id:
        name: Entity ID
        description: Technical mapping registered by Alexa. To change only the display name, edit Device name instead.
      name:
        name: Device name
        description: Display name in the device list and HA Music.
      status:
        name: HA Music status
        description: >-
          Aktiv shows the device in Ingress and allows HA Music commands.
          Inaktiv hides it and prevents these commands without deleting the entry.
          Power supply and Alexa group membership are unaffected.
      enabled:
        name: Previous selection (automatically migrated)
        description: >-
          Only for older configurations. The next add-on start converts this value
          to Aktiv or Inaktiv. An explicitly selected HA Music status takes precedence;
          the previous selection is removed.

