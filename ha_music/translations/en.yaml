configuration:
  apple_music_target:
    name: Apple Music command device
    description: Entity ID of an Echo enabled in Alexa devices. Playback commands are sent to this device.
  apple_music_group:
    name: Apple Music speaker group
    description: Exact Alexa multiroom group name. Leave empty to play directly on the command device. Device visibility does not change Alexa group membership.
  apple_music_favorites:
    name: Apple Music favorites
    description: Link your Apple Music account in Alexa first. Add playlists or albums here, save and restart the add-on. No account credentials are needed in HA Music.
    fields:
      name:
        name: Display name
        description: Tile label; also used for the playback request unless a search phrase is provided.
      kind:
        name: Type
        description: Personal playlist or Apple Music album.
      search:
        name: Search phrase (optional)
        description: Exact playlist name or album title and artist. Leave empty to use the display name.
  show_dashboard_setup:
    name: Show dashboard setup
    description: Show Lovelace card setup in HA Music.
  devices:
    name: Alexa devices
    description: >-
      Detected devices are added when you turn on HA Music, including unavailable devices.
      This includes registered Echo Dots and Fire TVs. New devices are disabled initially.
      Use the pencil to select the HA Music status Aktiv (active) or Inaktiv (inactive), rather than deleting the entry.
      Hidden devices remain in this list. Save changes and restart the add-on.
    fields:
      entity_id:
        name: Entity ID
        description: The media_player entity registered by the Alexa integration.
      name:
        name: Device name
        description: Display name in the device list and HA Music.
      status:
        name: HA Music status
        description: >-
          Aktiv shows the device in Ingress and allows HA Music commands.
          Inaktiv hides it and prevents these commands without deleting the entry.
          Power supply and Alexa group membership are unaffected.
      enabled:
        name: Previous selection (automatically migrated)
        description: >-
          Only for older configurations. The next add-on start converts this value
          to Aktiv or Inaktiv. An explicitly selected HA Music status takes precedence;
          the previous selection is removed.
