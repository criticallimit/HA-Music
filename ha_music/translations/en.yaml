configuration:
  show_dashboard_setup:
    name: Show dashboard setup
    description: Show Lovelace card setup in HA Music.
  devices:
    name: Alexa devices
    description: >-
      Detected devices are added when you turn on HA Music, including unavailable devices.
      This includes registered Echo Dots and Fire TVs. New devices are disabled initially.
      Use the pencil to select the HA Music status Aktiv (active) or Inaktiv (inactive), rather than deleting the entry.
      Hidden devices remain in this list. Save changes and restart the add-on.
    fields:
      entity_id:
        name: Entity ID
        description: The media_player entity registered by the Alexa integration.
      name:
        name: Device name
        description: Display name in the device list and HA Music.
      status:
        name: HA Music status
        description: >-
          Aktiv shows the device in Ingress and allows HA Music commands.
          Inaktiv hides it and prevents these commands without deleting the entry.
          Power supply and Alexa group membership are unaffected.
      enabled:
        name: Previous selection (automatically migrated)
        description: >-
          Only for older configurations. The next power-on converts this value
          to Aktiv or Inaktiv. An explicitly selected HA Music status takes precedence;
          the previous selection is removed.
